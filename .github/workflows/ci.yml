name: site
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - run: python3 scripts/check_locales.py
      - run: python3 scripts/check.py
      - name: Commit generated output on Advisory branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/advisory-site-v1'
        run: |
          if ! git diff --quiet -- dist; then
            git config user.name "quietwire-site-ci"
            git config user.email "actions@users.noreply.github.com"
            git add dist
            git commit -m "Regenerate site output for Advisory"
            git push
          fi
      - name: Verify committed build output
        run: git diff --exit-code -- dist
