name: site
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make check
      - name: Materialize generated author output on author branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/library/author-spaces-v1'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Build author space output"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify committed build output
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
