name: Temporary Geometry Between Us build

on:
  push:
    branches:
      - publish/the-geometry-between-us

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/the-geometry-between-us
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate
        run: make check
      - name: Commit generated site
        run: |
          git config user.name "quietwire-site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: regenerate site for The Geometry Between Us"
          git push origin HEAD:publish/the-geometry-between-us
